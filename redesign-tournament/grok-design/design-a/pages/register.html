<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Design A · EnterLMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>


  <main class="auth-shell">
    <div class="auth-card stack" style="gap:1.25rem">
      <div class="stack" style="gap:.35rem">
        <a class="brand" href="home.html"><span class="brand-mark">E</span> EnterLMS</a>
        <h2 style="margin-top:.5rem">Buat akun</h2>
        <p class="muted" style="margin:0;font-size:.9rem">Akun baru berstatus learner secara default.</p>
      </div>
      <div class="field"><label>Nama lengkap</label><input class="input" placeholder="Budi Santoso" /></div>
      <div class="field"><label>Email kerja</label><input class="input" type="email" placeholder="budi@bank.co.id" /></div>
      <div class="field"><label>Password</label><input class="input" type="password" placeholder="Minimal 8 karakter" /></div>
      <a class="btn btn-primary btn-block" href="dashboard.html">Daftar</a>
      <p class="tiny" style="text-align:center">Sudah punya akun? <a href="login.html"><u>Masuk</u></a></p>
    </div>
  </main>

  <footer class="footer"><div class="container between"><span>© EnterLMS · Design A (mockup)</span><a class="tiny" href="../index.html">← Hub Design A</a></div></footer>
  <script src="../assets/app.js"></script>
</body>
</html>
