<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Design B</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-aside">
      <div class="brand" style="color:#fff"><span class="brand-mark">E</span> EnterLMS</div>
      <div>
        <h1 style="color:#fff;font-size:2rem;margin-bottom:.75rem">Selamat datang kembali</h1>
        <p style="opacity:.9;max-width:28rem">Masuk untuk melanjutkan pelatihan kepatuhan. Progress dan sertifikat tersimpan di akun Anda.</p>
      </div>
      <p class="tiny" style="color:#99f6e4">Demo: learner@enterlms.test / password</p>
    </aside>
    <main class="auth-main">
      <div class="auth-box stack" style="gap:1rem">
        <h2>Masuk ke akun</h2>
        <div class="field"><label>Email</label><input class="input" value="learner@enterlms.test" /><span class="hint">Gunakan email kerja Anda</span></div>
        <div class="field"><label>Password</label><input class="input" type="password" value="password" /></div>
        <a class="btn btn-primary btn-lg btn-block" href="dashboard.html">Masuk sekarang</a>
        <p class="help" style="text-align:center">Belum punya akun? <a href="register.html" style="color:var(--primary-dark);font-weight:700">Daftar gratis</a></p>
        <a class="tiny" href="../index.html">← Hub Design B</a>
      </div>
    </main>
  </div>
</body>
</html>
