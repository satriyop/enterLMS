<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register · Design B</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div class="auth-layout">
    <aside class="auth-aside">
      <div class="brand" style="color:#fff"><span class="brand-mark">E</span> Enteraksi</div>
      <div class="stack">
        <h1 style="color:#fff;font-size:2rem">Buat akun dalam 1 menit</h1>
        <div class="step done" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff"><strong style="color:#99f6e4">Setelah daftar</strong>Anda otomatis menjadi Learner dan bisa enroll kursus gratis.</div>
      </div>
      <p class="tiny" style="color:#99f6e4">Tidak perlu kartu kredit</p>
    </aside>
    <main class="auth-main">
      <div class="auth-box stack" style="gap:1rem">
        <h2>Form pendaftaran</h2>
        <div class="field"><label>Nama lengkap</label><input class="input" placeholder="Sesuai KTP / email kerja" /></div>
        <div class="field"><label>Email</label><input class="input" type="email" placeholder="nama@bank.co.id" /><span class="hint">Kami kirim konfirmasi ke email ini</span></div>
        <div class="field"><label>Password</label><input class="input" type="password" placeholder="Minimal 8 karakter" /></div>
        <a class="btn btn-primary btn-lg btn-block" href="dashboard.html">Buat akun &amp; lanjut</a>
        <p class="help" style="text-align:center">Sudah punya akun? <a href="login.html" style="color:var(--primary-dark);font-weight:700">Masuk</a></p>
      </div>
    </main>
  </div>
</body>
</html>
