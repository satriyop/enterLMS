[enterlms]
user = www-data
group = www-data
listen = __PHP_SOCK__
listen.owner = __CADDY_USER__
listen.group = __CADDY_USER__
listen.mode = 0660
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
php_admin_value[error_log] = /var/log/enterlms/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 50M
php_admin_value[max_execution_time] = 200
